<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vulgate Latin Flashcards</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent2: #0f3460;
  --text: #eee;
  --text-dim: #999;
  --success: #4ecca3;
  --fail: #e94560;
  --gold: #f0c040;
  --border: #333;
  --card-hover: #1e2d4f;
  --toggle-bg: #444;
}
body.light {
  --bg: #f0f2f5;
  --card: #ffffff;
  --accent: #d63851;
  --accent2: #e8edf3;
  --text: #1a1a2e;
  --text-dim: #666;
  --success: #2d9d78;
  --fail: #d63851;
  --gold: #c9960a;
  --border: #ddd;
  --card-hover: #f0f0f0;
  --toggle-bg: #ccc;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

/* NAV */
.nav {
  display: flex;
  justify-content: space-around;
  background: var(--card);
  padding: 8px 0;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 8px);
}
.nav button {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 4px 12px;
}
.nav button.active { color: var(--accent); }
.nav button svg { width: 24px; height: 24px; }

/* SCREENS */
.screen { display:none; padding: 16px 16px 80px; max-width: 500px; margin: 0 auto; }
.screen.active { display: block; }

/* HEADER */
.screen-header {
  text-align: center;
  margin-bottom: 16px;
  padding-top: 8px;
}
.screen-header h1 { font-size: 22px; margin-bottom: 4px; }
.screen-header p { font-size: 13px; color: var(--text-dim); }

/* CARDS */
.flashcard {
  background: var(--card);
  border-radius: 16px;
  padding: 40px 24px;
  text-align: center;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.flashcard:active { transform: scale(0.98); }
.flashcard .latin { font-size: var(--latin-size, 40px); font-weight: 700; margin-bottom: 8px; }
.flashcard .pos { font-size: 14px; color: var(--text-dim); font-style: italic; }
.flashcard .english { font-size: 22px; color: var(--success); margin-top: 16px; }
.flashcard .rank-badge {
  position: absolute;
  top: 12px;
  right: 14px;
  font-size: 12px;
  color: var(--text-dim);
  background: rgba(128,128,128,0.15);
  padding: 2px 8px;
  border-radius: 10px;
}
.flashcard .tap-hint {
  position: absolute;
  bottom: 14px;
  font-size: 11px;
  color: var(--text-dim);
}

/* SR BUTTONS */
.sr-buttons {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  justify-content: center;
}
.sr-buttons button {
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  flex: 1;
  max-width: 150px;
}
.sr-buttons .btn-again { background: var(--fail); color: #fff; }
.sr-buttons .btn-hard { background: #e67e22; color: #fff; }
.sr-buttons .btn-good { background: var(--success); color: #1a1a2e; }
.sr-buttons .btn-easy { background: var(--gold); color: #1a1a2e; }

/* PROGRESS BAR */
.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  margin: 12px 0;
  overflow: hidden;
}
.progress-bar .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
}

/* STATS ROW */
.stats-row {
  display: flex;
  justify-content: space-around;
  margin: 12px 0;
  font-size: 13px;
  color: var(--text-dim);
}
.stats-row span b { color: var(--text); }

/* DECK LIST */
.deck-list { display: flex; flex-direction: column; gap: 10px; }
.deck-item {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: background 0.2s;
}
.deck-item:active { background: var(--card-hover); }
.deck-item .deck-info h3 { font-size: 16px; margin-bottom: 2px; }
.deck-item .deck-info p { font-size: 12px; color: var(--text-dim); }
.deck-item .deck-count {
  background: var(--accent2);
  color: var(--text);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}

/* BROWSE */
.word-list { display: flex; flex-direction: column; gap: 6px; }
.word-row {
  background: var(--card);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.word-row:active { background: var(--card-hover); }
.word-row .wr-left { display: flex; align-items: baseline; gap: 10px; }
.word-row .wr-rank { font-size: 11px; color: var(--text-dim); min-width: 28px; }
.word-row .wr-latin { font-size: 16px; font-weight: 600; }
.word-row .wr-pos { font-size: 12px; color: var(--text-dim); }
.word-row .wr-english { font-size: 13px; color: var(--text-dim); display: none; }
.word-row.revealed .wr-english { display: block; color: var(--success); }

/* QUIZ */
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.quiz-option {
  background: var(--card);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 16px;
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.quiz-option:active { transform: scale(0.98); }
.quiz-option.correct { border-color: var(--success); background: rgba(78,204,163,0.15); }
.quiz-option.wrong { border-color: var(--fail); background: rgba(233,69,96,0.15); }
.quiz-option.dimmed { opacity: 0.4; }
.quiz-next {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  display: none;
}
.quiz-score {
  text-align: center;
  margin: 10px 0;
  font-size: 14px;
  color: var(--text-dim);
}
.quiz-score b { color: var(--text); }

/* SETTINGS/STATS */
.stat-card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
}
.stat-card h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 8px; }
.stat-card .big-num { font-size: 36px; font-weight: 700; }
.stat-card .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.reset-btn {
  background: var(--fail);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.reset-btn:active { opacity: 0.8; }
.reset-section {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-top: 10px;
}
.reset-section h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 10px; }
.reset-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.reset-row span { font-size: 14px; }

/* BACK BTN */
.back-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-top: 8px;
}
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.back-bar h2 { font-size: 18px; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { color: var(--text); margin-bottom: 8px; }

/* QUIZ SOURCE SELECTOR */
.quiz-source {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.quiz-source button {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}
.quiz-source button.active {
  background: var(--accent);
  border-color: var(--accent);
}

/* SR DONE */
.sr-done {
  text-align: center;
  padding: 40px 20px;
}
.sr-done h2 { font-size: 24px; margin-bottom: 8px; color: var(--success); }
.sr-done p { color: var(--text-dim); font-size: 14px; }

/* SAVE TOAST */
.save-toast {
  position: fixed;
  top: 12px;
  right: 12px;
  background: var(--success);
  color: #1a1a2e;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity 0.3s, transform 0.3s;
  z-index: 200;
  pointer-events: none;
}
.save-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* SETTINGS */
.setting-group {
  background: var(--card);
  border-radius: 12px;
  padding: 4px 0;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.setting-group h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  padding: 12px 16px 4px;
}
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-row .setting-label { font-size: 15px; }
.setting-row .setting-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

/* Toggle switch */
.toggle {
  position: relative;
  width: 48px;
  height: 28px;
  cursor: pointer;
}
.toggle input { display: none; }
.toggle .slider {
  position: absolute;
  inset: 0;
  background: var(--toggle-bg);
  border-radius: 28px;
  transition: background 0.2s;
}
.toggle .slider::before {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle input:checked + .slider { background: var(--success); }
.toggle input:checked + .slider::before { transform: translateX(20px); }

/* Stepper */
.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
}
.stepper button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stepper button:active { background: var(--card-hover); }
.stepper .stepper-val {
  font-size: 16px;
  font-weight: 600;
  min-width: 28px;
  text-align: center;
}

/* Select pill group */
.pill-group {
  display: flex;
  gap: 6px;
}
.pill-group button {
  padding: 6px 12px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}
.pill-group button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
</style>
</head>
<body>

  <div class="stats-row" id="sr-stats"></div>
  <div class="progress-bar"><div class="fill" id="sr-progress"></div></div>
  <div id="sr-card-area"></div>
</div>

<!-- DECKS (Browse by frequency) -->
<div class="screen" id="screen-decks">

    <h1>Sub-Decks</h1>

<div class="screen" id="screen-quiz">

</div>

<div class="screen" id="screen-stats">

</div>

<!-- SETTINGS -->
<div class="screen" id="screen-settings">

</div>

  </button>
</div>

// ===== DATA LAYER =====
const STORAGE_KEY = 'vulgate_sr_v2';
const SETTINGS_KEY = 'vulgate_settings_v1';
const SUB_DECKS = [];
for (let i = 0; i < 1000; i += 20) {
  SUB_DECKS.push({ start: i, end: i + 20, label: `Words ${i+1}–${i+20}` });
}

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d && d.version === 2) return d;
  } catch(e) {}
  return initData();
}

function initData() {
  const cards = {};
  WORDS.forEach(w => {
    cards[w.rank] = {
      interval: 0,    // minutes
      ease: 2.5,
      due: Date.now(),
      reps: 0,
      lapses: 0
    };
  });
  const data = {
    version: 2,
    cards,
    quizWrong: {},    // rank -> count
    totalReviews: 0,
    totalQuizzes: 0,
    quizCorrect: 0,
    streak: 0,
    lastReview: null
  };
  saveData(data);
  return data;
}

let _saveToast = null;
function saveData(data) {
  data.lastSaved = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  const toast = document.getElementById('save-toast');
  if (toast) {
    toast.classList.add('show');
    clearTimeout(_saveToast);
    _saveToast = setTimeout(() => toast.classList.remove('show'), 1200);
  }
}

let DATA = loadData();

// ===== SETTINGS =====
const DEFAULT_SETTINGS = {
  darkMode: true,
  soundEnabled: true,
  soundVolume: 0.5,
  newCardsPerDay: 20,
  fontSize: 'medium',   // small, medium, large
  cardDirection: 'latin-first', // latin-first or english-first
  showPos: true,
  haptic: true
};

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s) return { ...DEFAULT_SETTINGS, ...s };
  } catch(e) {}
  return { ...DEFAULT_SETTINGS };
}
function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS));
}
let SETTINGS = loadSettings();

function applyTheme() {
  document.body.classList.toggle('light', !SETTINGS.darkMode);
}
applyTheme();

function applyFontSize() {
  const sizes = { small: '32px', medium: '40px', large: '52px' };
  document.documentElement.style.setProperty('--latin-size', sizes[SETTINGS.fontSize] || '40px');
}
applyFontSize();

// ===== SOUND ENGINE (Web Audio API) =====
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, dur, type, vol) {
  if (!SETTINGS.soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = (vol || 0.3) * SETTINGS.soundVolume;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function playCorrect() {
  playTone(523, 0.12, 'sine');
  setTimeout(() => playTone(659, 0.12, 'sine'), 80);
  setTimeout(() => playTone(784, 0.18, 'sine'), 160);
}
function playWrong() {
  playTone(280, 0.25, 'sawtooth', 0.15);
  setTimeout(() => playTone(220, 0.35, 'sawtooth', 0.12), 150);
}
function playFlip() {
  playTone(880, 0.06, 'sine', 0.15);
}
function playClick() {
  playTone(600, 0.04, 'sine', 0.1);
}

function doHaptic(ms) {
  if (SETTINGS.haptic && navigator.vibrate) {
    navigator.vibrate(ms || 10);
  }
}

// ===== SPACED REPETITION (SM-2 variant) =====
function getDueCards() {
  const now = Date.now();
  return WORDS.filter(w => DATA.cards[w.rank].due <= now);
}

function getNewCards(limit) {
  return WORDS.filter(w => DATA.cards[w.rank].reps === 0).slice(0, limit);
}

function reviewCard(rank, quality) {
  // quality: 0=again, 1=hard, 2=good, 3=easy
  const c = DATA.cards[rank];
  DATA.totalReviews++;
  DATA.lastReview = Date.now();

  if (quality === 0) {
    c.interval = 1;
    c.ease = Math.max(1.3, c.ease - 0.2);
    c.lapses++;
  } else if (quality === 1) {
    c.interval = c.reps === 0 ? 1 : Math.max(1, c.interval * 1.2);
    c.ease = Math.max(1.3, c.ease - 0.15);
  } else if (quality === 2) {
    if (c.reps === 0) c.interval = 10;
    else if (c.reps === 1) c.interval = 1440; // 1 day
    else c.interval = c.interval * c.ease;
  } else {
    if (c.reps === 0) c.interval = 1440 * 4;
    else c.interval = c.interval * c.ease * 1.3;
    c.ease += 0.15;
  }
  c.reps++;
  c.due = Date.now() + c.interval * 60000;
  saveData(DATA);
}

// ===== SCREEN MANAGEMENT =====
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + name).classList.add('active');

  if (name === 'learn') renderLearn();
  else if (name === 'decks') renderDecks();
  else if (name === 'quiz') renderQuiz();
  else if (name === 'stats') renderStats();
  else if (name === 'settings') renderSettings();
}

// ===== LEARN SCREEN =====
let currentSRCard = null;
let srRevealed = false;

function renderLearn() {
  const due = getDueCards();
  const newCards = getNewCards(SETTINGS.newCardsPerDay);
  const queue = [...due];
  // Add new cards if we have fewer than 10 due
  if (queue.length < 10) {
    newCards.forEach(w => {
      if (!queue.find(q => q.rank === w.rank)) queue.push(w);
    });
  }

  const learned = WORDS.filter(w => DATA.cards[w.rank].reps > 0).length;
  const mature = WORDS.filter(w => DATA.cards[w.rank].interval >= 1440 * 21).length;

  document.getElementById('sr-stats').innerHTML =
    `<span>Due: <b>${due.length}</b></span>` +
    `<span>New: <b>${newCards.length}</b></span>` +
    `<span>Learned: <b>${learned}</b></span>`;

  document.getElementById('sr-progress').style.width = (learned / 10) + '%';

  const area = document.getElementById('sr-card-area');
  if (queue.length === 0) {
    area.innerHTML = `
      <div class="sr-done">
        <h2>All caught up!</h2>
        <p>No cards due right now.<br>Come back later or add new cards from Decks.</p>
        <p style="margin-top:16px; font-size:13px; color:var(--text-dim);">
          ${learned} / 1000 words learned<br>
          ${mature} mature (21+ days)
        </p>
      </div>`;
    return;
  }

  currentSRCard = queue[0];
  srRevealed = false;
  renderSRCard();
}

function renderSRCard() {
  const w = currentSRCard;
  const area = document.getElementById('sr-card-area');
  const latinFirst = SETTINGS.cardDirection === 'latin-first';
  const front = latinFirst ? w.latin : w.english;
  const back = latinFirst ? w.english : w.latin;
  const posHtml = SETTINGS.showPos ? `<div class="pos">${w.pos}</div>` : '';
  if (!srRevealed) {
    area.innerHTML = `
      <div class="flashcard" onclick="revealSR()">
        <span class="rank-badge">#${w.rank}</span>
        <div class="${latinFirst ? 'latin' : 'english'}" style="${latinFirst ? '' : 'color:var(--text);font-size:var(--latin-size,40px);font-weight:700;'}">${front}</div>
        ${latinFirst ? posHtml : ''}
        <div class="tap-hint">Tap to reveal</div>
      </div>`;
  } else {
    area.innerHTML = `
      <div class="flashcard">
        <span class="rank-badge">#${w.rank}</span>
        <div class="${latinFirst ? 'latin' : 'english'}" style="${latinFirst ? '' : 'color:var(--text);font-size:var(--latin-size,40px);font-weight:700;'}">${front}</div>
        ${posHtml}
        <div class="${latinFirst ? 'english' : 'latin'}" style="${latinFirst ? '' : 'margin-top:16px;'}">${back}</div>
      </div>
      <div class="sr-buttons">
        <button class="btn-again" onclick="answerSR(0)">Again</button>
        <button class="btn-hard" onclick="answerSR(1)">Hard</button>
        <button class="btn-good" onclick="answerSR(2)">Good</button>
        <button class="btn-easy" onclick="answerSR(3)">Easy</button>
      </div>`;
  }
}

function revealSR() {
  srRevealed = true;
  playFlip();
  doHaptic(10);
  renderSRCard();
}

function answerSR(quality) {
  if (quality >= 2) playCorrect();
  else playWrong();
  doHaptic(quality >= 2 ? 10 : 30);
  reviewCard(currentSRCard.rank, quality);
  renderLearn();
}

// ===== DECKS SCREEN =====
function renderDecks() {
  const list = document.getElementById('deck-list');
  list.innerHTML = SUB_DECKS.map(d => {
    const words = WORDS.slice(d.start, d.end);
    const learned = words.filter(w => DATA.cards[w.rank].reps > 0).length;
    return `
      <div class="deck-item" onclick="openDeck(${d.start}, ${d.end})">

        </div>
        <span class="deck-count">${d.end <= 100 ? 'Core' : d.end <= 300 ? 'Common' : d.end <= 600 ? 'Intermediate' : 'Advanced'}</span>
      </div>`;
  }).join('');
}

function openDeck(start, end) {
  const words = WORDS.slice(start, end);
  document.getElementById('browse-title').textContent = `Words ${start+1}–${end}`;
  const list = document.getElementById('word-list');

    <div class="word-row" onclick="this.classList.toggle('revealed')">

// ===== QUIZ SCREEN =====
let quizDeck = 'all';
let quizCurrent = null;
let quizAnswered = false;
let quizSessionCorrect = 0;
let quizSessionTotal = 0;

function renderQuiz() {
  const src = document.getElementById('quiz-source');
  const options = [{key:'all', label:'All 1000'}];
  SUB_DECKS.forEach(d => options.push({key:`${d.start}-${d.end}`, label: d.label}));

  src.innerHTML = options.map(o =>
    `<button class="${quizDeck===o.key?'active':''}" onclick="setQuizDeck('${o.key}')">${o.label}</button>`
  ).join('');

  renderQuizScore();
  nextQuizQuestion();
}

function setQuizDeck(key) {
  quizDeck = key;
  quizSessionCorrect = 0;
  quizSessionTotal = 0;
  renderQuiz();
}

function getQuizPool() {
  if (quizDeck === 'all') return WORDS;
  const [s, e] = quizDeck.split('-').map(Number);
  return WORDS.slice(s, e);
}

function renderQuizScore() {
  const wrongTotal = Object.values(DATA.quizWrong).reduce((a,b) => a+b, 0);
  document.getElementById('quiz-score').innerHTML =
    `Session: <b>${quizSessionCorrect}/${quizSessionTotal}</b> | Total wrong: <b>${wrongTotal}</b>`;
}

function nextQuizQuestion() {
  const pool = getQuizPool();
  if (pool.length < 4) return;

  quizAnswered = false;
  const idx = Math.floor(Math.random() * pool.length);
  quizCurrent = pool[idx];

  // Pick 3 wrong answers from full word list
  const wrongOptions = [];
  while (wrongOptions.length < 3) {
    const w = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (w.rank !== quizCurrent.rank && !wrongOptions.find(o => o.rank === w.rank)) {
      wrongOptions.push(w);
    }
  }

  const choices = [quizCurrent, ...wrongOptions].sort(() => Math.random() - 0.5);

  const area = document.getElementById('quiz-area');
  area.innerHTML = `
    <div class="flashcard" style="cursor:default; min-height:160px;">
      <span class="rank-badge">#${quizCurrent.rank}</span>
      <div class="latin">${quizCurrent.latin}</div>
      <div class="pos">${quizCurrent.pos}</div>
    </div>
    <div class="quiz-options">
      ${choices.map(c => `
        <button class="quiz-option" data-rank="${c.rank}" onclick="quizAnswer(this, ${c.rank})">
          ${c.english}
        </button>`).join('')}
    </div>
    <button class="quiz-next" id="quiz-next-btn" onclick="nextQuizQuestion();renderQuizScore();">Next Question</button>`;
}

function quizAnswer(btn, chosenRank) {
  if (quizAnswered) return;
  quizAnswered = true;
  quizSessionTotal++;
  DATA.totalQuizzes++;

  const correct = chosenRank === quizCurrent.rank;
  if (correct) {
    quizSessionCorrect++;
    DATA.quizCorrect++;
    btn.classList.add('correct');
    playCorrect();
    doHaptic(10);
  } else {
    btn.classList.add('wrong');
    playWrong();
    doHaptic(30);
    DATA.quizWrong[quizCurrent.rank] = (DATA.quizWrong[quizCurrent.rank] || 0) + 1;
    // Highlight the correct answer
    document.querySelectorAll('.quiz-option').forEach(b => {
      if (parseInt(b.dataset.rank) === quizCurrent.rank) b.classList.add('correct');
      else if (b !== btn) b.classList.add('dimmed');
    });
  }

  document.querySelectorAll('.quiz-option').forEach(b => {
    if (!b.classList.contains('correct') && !b.classList.contains('wrong'))
      b.classList.add('dimmed');
  });

  saveData(DATA);
  renderQuizScore();
  document.getElementById('quiz-next-btn').style.display = 'block';
}

// ===== STATS SCREEN =====
function renderStats() {
  const learned = WORDS.filter(w => DATA.cards[w.rank].reps > 0).length;
  const mature = WORDS.filter(w => DATA.cards[w.rank].interval >= 1440 * 21).length;
  const due = getDueCards().length;
  const wrongTotal = Object.values(DATA.quizWrong).reduce((a,b) => a+b, 0);
  const wrongWords = Object.keys(DATA.quizWrong).length;

  // Most missed words
  const topMissed = Object.entries(DATA.quizWrong)
    .sort((a,b) => b[1] - a[1])
    .slice(0, 10)
    .map(([rank, count]) => {
      const w = WORDS.find(w => w.rank == rank);
      return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
        <span>${w.latin} <span style="color:var(--text-dim);font-size:12px;">(${w.english})</span></span>
        <span style="color:var(--fail);font-weight:600;">${count}x</span>
      </div>`;
    }).join('');

  document.getElementById('stats-area').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="stat-card">
        <h3>Words Learned</h3>
        <div class="big-num">${learned}</div>
        <div class="sub">of 1,000</div>
      </div>
      <div class="stat-card">
        <h3>Mature Cards</h3>
        <div class="big-num">${mature}</div>
        <div class="sub">21+ day interval</div>
      </div>
      <div class="stat-card">
        <h3>Total Reviews</h3>
        <div class="big-num">${DATA.totalReviews}</div>
        <div class="sub">SR reviews</div>
      </div>
      <div class="stat-card">
        <h3>Quiz Accuracy</h3>
        <div class="big-num">${DATA.totalQuizzes ? Math.round(DATA.quizCorrect/DATA.totalQuizzes*100) : 0}%</div>
        <div class="sub">${DATA.quizCorrect}/${DATA.totalQuizzes} correct</div>
      </div>
    </div>
    <div class="stat-card" style="margin-top:10px;">
      <h3>Cards Due Now</h3>
      <div class="big-num">${due}</div>
    </div>
    ${topMissed ? `
    <div class="stat-card" style="margin-top:10px;">
      <h3>Most Missed (Quiz)</h3>
      ${topMissed}
    </div>` : ''}`;
}

function resetQuizWrong() {
  if (!confirm('Reset all quiz wrong counts?')) return;
  DATA.quizWrong = {};
  saveData(DATA);
  renderStats();
}
function resetQuizAll() {
  if (!confirm('Reset all quiz statistics?')) return;
  DATA.quizWrong = {};
  DATA.totalQuizzes = 0;
  DATA.quizCorrect = 0;
  quizSessionCorrect = 0;
  quizSessionTotal = 0;
  saveData(DATA);
  renderStats();
}
function resetSR() {
  if (!confirm('Reset all spaced repetition progress? This cannot be undone.')) return;
  WORDS.forEach(w => {
    DATA.cards[w.rank] = { interval:0, ease:2.5, due:Date.now(), reps:0, lapses:0 };
  });
  DATA.totalReviews = 0;
  saveData(DATA);
  renderStats();
}
function resetAll() {
  if (!confirm('Reset EVERYTHING? All progress will be lost.')) return;
  DATA = initData();
  quizSessionCorrect = 0;
  quizSessionTotal = 0;
  renderStats();
}

// ===== SETTINGS SCREEN =====

  const area = document.getElementById('settings-area');
  area.innerHTML = `
    <div class="setting-group">
      <h3>Appearance</h3>
      <div class="setting-row">
        <div>
          <div class="setting-label">Dark Mode</div>
        </div>
        <label class="toggle">
          <input type="checkbox" ${SETTINGS.darkMode ? 'checked' : ''} onchange="toggleSetting('darkMode', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Font Size</div>
        </div>
        <div class="pill-group">
          <button class="${SETTINGS.fontSize==='small'?'active':''}" onclick="setSetting('fontSize','small')">Small</button>
          <button class="${SETTINGS.fontSize==='medium'?'active':''}" onclick="setSetting('fontSize','medium')">Medium</button>
          <button class="${SETTINGS.fontSize==='large'?'active':''}" onclick="setSetting('fontSize','large')">Large</button>
        </div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Show Part of Speech</div>
        </div>
        <label class="toggle">
          <input type="checkbox" ${SETTINGS.showPos ? 'checked' : ''} onchange="toggleSetting('showPos', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group">
      <h3>Sound & Feedback</h3>
      <div class="setting-row">
        <div>
          <div class="setting-label">Sound Effects</div>
        </div>
        <label class="toggle">
          <input type="checkbox" ${SETTINGS.soundEnabled ? 'checked' : ''} onchange="toggleSetting('soundEnabled', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row" id="volume-row" style="${SETTINGS.soundEnabled ? '' : 'opacity:0.4;pointer-events:none;'}">
        <div>
          <div class="setting-label">Volume</div>
        </div>
        <input type="range" min="0" max="100" value="${Math.round(SETTINGS.soundVolume*100)}"
          style="width:120px;accent-color:var(--accent);"
          oninput="SETTINGS.soundVolume=this.value/100;saveSettings();"
          onchange="playCorrect();">
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Haptic Feedback</div>
          <div class="setting-desc">Vibration on answers (mobile)</div>
        </div>
        <label class="toggle">
          <input type="checkbox" ${SETTINGS.haptic ? 'checked' : ''} onchange="toggleSetting('haptic', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group">
      <h3>Study</h3>
      <div class="setting-row">
        <div>
          <div class="setting-label">New Cards per Session</div>
        </div>
        <div class="stepper">
          <button onclick="adjustNewCards(-5)">-</button>
          <span class="stepper-val" id="new-cards-val">${SETTINGS.newCardsPerDay}</span>
          <button onclick="adjustNewCards(5)">+</button>
        </div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Card Direction</div>
          <div class="setting-desc">Which side shows first</div>
        </div>
        <div class="pill-group">
          <button class="${SETTINGS.cardDirection==='latin-first'?'active':''}" onclick="setSetting('cardDirection','latin-first')">Latin</button>
          <button class="${SETTINGS.cardDirection==='english-first'?'active':''}" onclick="setSetting('cardDirection','english-first')">English</button>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <h3>Reset Data</h3>
      <div class="setting-row">
        <span class="setting-label">Quiz wrong counts</span>
        <button class="reset-btn" style="padding:8px 16px;font-size:13px;" onclick="resetQuizWrong()">Reset</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">All quiz stats</span>
        <button class="reset-btn" style="padding:8px 16px;font-size:13px;" onclick="resetQuizAll()">Reset</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">SR progress</span>
        <button class="reset-btn" style="padding:8px 16px;font-size:13px;" onclick="resetSR()">Reset</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Everything</span>
        <button class="reset-btn" style="padding:8px 16px;font-size:13px;" onclick="resetAll()">Reset All</button>
      </div>
    </div>

    <div style="text-align:center;padding:16px;color:var(--text-dim);font-size:12px;">
      Vulgate Latin Flashcards &middot; 1,000 words<br>
      ${DATA.lastSaved ? 'Last saved: ' + new Date(DATA.lastSaved).toLocaleString() : 'Not yet saved'}<br>
      Progress auto-saves to this device.
    </div>`;
}

function toggleSetting(key, val) {
  SETTINGS[key] = val;
  saveSettings();
  if (key === 'darkMode') applyTheme();
  if (key === 'soundEnabled') renderSettings();
  playClick();
}

function setSetting(key, val) {
  SETTINGS[key] = val;
  saveSettings();
  if (key === 'fontSize') applyFontSize();
  renderSettings();
  playClick();
}

function adjustNewCards(delta) {
  SETTINGS.newCardsPerDay = Math.max(5, Math.min(50, SETTINGS.newCardsPerDay + delta));
  saveSettings();
  document.getElementById('new-cards-val').textContent = SETTINGS.newCardsPerDay;
  playClick();
}

// ===== INIT =====
renderLearn();
</script>
</body>
</html>
